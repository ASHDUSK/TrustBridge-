seed_everything: 42
trainer:
  accelerator: gpu
  strategy: auto
  devices: [0]
  num_nodes: 1
  precision: bf16-mixed
  logger:
    - class_path: CSVLogger
      init_args:
        save_dir: runs
        name: t1t2
  callbacks:
    - class_path: RichProgressBar
      init_args:
        leave: true
    - class_path: ModelCheckpoint
      init_args:
        every_n_epochs: 5
        save_on_train_epoch_end: true
        save_top_k: -1
  max_epochs: 30
  check_val_every_n_epoch: 5
  num_sanity_val_steps: 0
  log_every_n_steps: 50
  deterministic: false
  inference_mode: true
  use_distributed_sampler: false
  sync_batchnorm: false

model:
  lr_g: 0.00016
  lr_d: 0.0001
  disc_grad_penalty_freq: 10
  disc_grad_penalty_weight: 0.5
  lambda_rec_loss: 0.5
  optim_betas: [0.5, 0.9]
  eval_mask: false
  eval_subject: false
  diffusion_params:
    n_steps: 10
    beta_start: 0.1
    beta_end: 3.0
    gamma: 1
    n_recursions: 2
    consistency_threshold: 0.01
  generator_params:
    self_recursion: true
    image_size: 128
    z_emb_dim: 256
    ch_mult: [1, 1, 2, 2, 4, 4]
    num_res_blocks: 2
    attn_resolutions: [16]
    dropout: 0.0
    resamp_with_conv: true
    conditional: true
    fir: true
    fir_kernel: [1, 3, 3, 1]
    skip_rescale: true
    resblock_type: biggan
    progressive: none
    progressive_input: residual
    embedding_type: positional
    combine_method: sum
    fourier_scale: 16
    nf: 64
    num_channels: 2
    nz: 100
    n_mlp: 3
    centered: true
    not_use_tanh: false
  discriminator_params:
    nc: 2
    ngf: 32
    t_emb_dim: 256

data:
  train_batch_size: 8
  val_batch_size: 8
  test_batch_size: 8
  dataset_dir: data/selfrdb_format_v3
  source_modality: T2
  target_modality: T1
  dataset_class: NumpyDataset
  image_size: 128
  padding: true
  norm: true
  num_workers: 2

ckpt_path:
